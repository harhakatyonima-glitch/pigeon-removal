<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>הרחקת יונים בראש העין ופתח תקווה</title>
</head>
<body class="bg-slate-50 text-slate-900 font-sans text-center">

    <!-- Hero Section המשופר -->
    <header class="relative bg-emerald-900 text-white py-24 px-6 shadow-2xl">
        <div class="max-w-4xl mx-auto">
            <div class="mb-4 inline-flex items-center bg-emerald-800 px-4 py-1 rounded-full text-sm font-semibold text-emerald-200 border border-emerald-600">
                <i class="fas fa-shield-alt ml-2"></i> אחריות מלאה ל-3 שנים
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold mb-6">הרחקת יונים בראש העין ופתח תקווה</h1>
            <p class="text-xl md:text-2xl text-emerald-100 mb-10">המומחים שלכם לבית נקי מיונים. שירות מקצועי, הומני ומהיר.</p>
            <a href="https://wa.me/972547487633?text=שלום! אשמח להצעת מחיר להרחקת יונים." class="inline-block bg-yellow-400 hover:bg-yellow-300 text-emerald-900 font-bold py-5 px-10 rounded-full text-xl shadow-[0_0_20px_rgba(250,204,21,0.5)] transition hover:scale-105">
                <i class="fab fa-whatsapp ml-2"></i> קבלו הצעת מחיר בוואטסאפ
            </a>
        </div>
    </header>

    <!-- טופס יצירת קשר משודרג -->
    <section class="max-w-xl mx-auto py-16 px-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
            <h2 class="text-2xl font-bold mb-6">השאירו פרטים ונחזור אליכם</h2>
            <form action="https://formspree.io/f/mqazqjqz" method="POST" class="space-y-4">
                <input type="text" name="name" placeholder="שם מלא" required class="w-full p-4 rounded-xl border border-slate-200">
                <input type="tel" name="phone" placeholder="טלפון" required class="w-full p-4 rounded-xl border border-slate-200">
                <select name="type" class="w-full p-4 rounded-xl border border-slate-200 text-slate-500">
                    <option value="">סוג המבנה?</option>
                    <option value="דירה">דירה פרטית</option>
                    <option value="בית משותף">בניין/בית משותף</option>
                    <option value="גג">גג רעפים/פרגולה</option>
                </select>
                <button type="submit" class="w-full bg-emerald-700 text-white font-bold py-4 rounded-xl hover:bg-emerald-800 transition">שלחו לי הצעת מחיר</button>
            </form>
        </div>
    </section>

    <!-- כפתור וואטסאפ צף (Sticky) -->
    <a href="https://wa.me/972547487633?text=שלום! הגעתי דרך האתר ואשמח להצעת מחיר." class="fixed bottom-6 right-6 z-50 bg-green-500 text-white p-4 rounded-full shadow-lg hover:scale-110 transition animate-bounce">
        <i class="fab fa-whatsapp text-3xl"></i>
    </a>

</body>
</html>
